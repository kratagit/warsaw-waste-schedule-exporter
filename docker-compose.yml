services:
  waste-app:
    # Obraz budowany automatycznie przy wrzuceniu na main (.github/workflows/build.yml).
    # Do pracy nad kodem lokalnie zakomentuj "image" i odkomentuj "build".
    image: ghcr.io/kratagit/warsaw-waste-schedule-exporter:latest
    # build: .
    container_name: waste_app
    restart: unless-stopped  # Aplikacja wstanie sama po restarcie serwera
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Warsaw     # Ważne, żeby harmonogram działał w polskim czasie
      # Stan trzymamy w /app/data, żeby przeżył aktualizację obrazu
      - CREDENTIALS_FILE=/app/data/credentials.json
      - TOKEN_FILE=/app/data/token.pickle
      - STATE_FILE=/app/data/last_state.json
    volumes:
      # ./data trzyma dwie rózne rzeczy:
      #  * to, czego nie da się odtworzyć - credentials.json i token.pickle
      #    (bez nich trzeba od nowa logować się do Google),
      #  * dane odświeżalne - harmonogram Jeziorowskich (data/jeziorowskie) oraz
      #    last_state.json. Harmonogram zmienia się co roku i pobiera się go
      #    ponownie przyciskiem "Synchronizuj", więc jego utrata nie boli.
      - ./data:/app/data
      # pobrane PDF-y warszawskie (Oryginał / Opisany) - też odtwarzalne
      - ./static:/app/static
